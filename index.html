<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Визитка разработчика | Юрченко Станислав</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; padding: 40px 16px; margin: 0; }
    .profile-card { max-width: 480px; margin: 0 auto; background: #ffffff; padding: 32px; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; text-align: center; }
    .avatar { width: 90px; height: 90px; background: #2563eb; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; margin: 0 auto 16px; line-height: 90px; }
    h1 { margin: 0 0 8px; font-size: 24px; color: #0f172a; }
    .role { color: #2563eb; font-weight: 600; margin-bottom: 16px; font-size: 14px; }
    .skills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 20px 0; }
    .skill-tag { background: #f1f5f9; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; }
    .btn { display: inline-block; background: #2563eb; color: white; text-decoration: none; padding: 12px 24px; border-radius: 10px; font-weight: bold; font-size: 14px; transition: background 0.2s; }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="avatar">ИИ</div>
    <h1>Юрченко Станислав</h1></h1>
    <div class="role">Студент 2 курса · Технология программирования</div>
    <p>Создаю свой первый инженерный веб-сервис на GitHub Pages. Изучаю Git, HTML5, CSS3 и архитектуру чистого кода.</p>
    
    <div class="skills">
      <span class="skill-tag">HTML5</span>
      <span class="skill-tag">CSS3</span>
      <span class="skill-tag">Git & GitHub</span>
      <span class="skill-tag">HTTP Protocol</span>
    </div>

    <a href="https://github.com" target="_blank" class="btn">Мой GitHub профиль</a>
  </div>
</body>
</html>
